name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate shell script syntax
        run: |
          for script in scripts/*.sh; do
            echo "Checking $script"
            bash -n "$script"
          done
      - name: Validate Python script syntax
        run: python -m py_compile scripts/*.py
      - name: Validate environment YAML
        run: |
          python -m pip install --quiet pyyaml
          python -c "import yaml; data = yaml.safe_load(open('envs/pdr-pa-wgs.yml')); assert data['name'] == 'pdr-pa-wgs' and data['dependencies']"
